<!DOCTYPE html>
<html lang="pt-BR">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Cadastro de usu&aacute;rio | Est&uacute;dio Ink
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <nav class="navbar navbar-expand-lg navbar-dark" style="background:#211b1b">
   <div class="container">
    <a class="navbar-brand" href="dashboard.html">
     ✦ Est&uacute;dio Ink
    </a>
    <div class="d-flex align-items-center gap-3">
     <span class="text-white small" id="usuarioAtual">
     </span>
     <a class="btn btn-sm btn-outline-light" href="dashboard.html">
      Painel
     </a>
     <button class="btn btn-sm btn-light" id="botaoSair">
      Sair
     </button>
    </div>
   </div>
  </nav>
  <main class="container py-4">
   <div class="row justify-content-center">
    <div class="col-lg-7">
     <div class="card p-4">
      <h1 class="h3">
       Cadastrar usu&aacute;rio
      </h1>
      <p class="small-muted">
       Somente administradores podem criar contas.
      </p>
      <div aria-live="polite" id="aviso">
      </div>
      <form id="formCadastro">
       <div class="mb-3">
        <label class="form-label" for="nome">
         Nome
        </label>
        <input class="form-control" id="nome" maxlength="100" required=""/>
       </div>
       <div class="mb-3">
        <label class="form-label" for="email">
         E-mail
        </label>
        <input class="form-control" id="email" required="" type="email"/>
       </div>
       <div class="mb-3">
        <label class="form-label" for="senha">
         Senha (m&iacute;nimo 10 caracteres)
        </label>
        <input autocomplete="new-password" class="form-control" id="senha" maxlength="72" minlength="10" required="" type="password"/>
       </div>
       <div class="mb-3">
        <label class="form-label" for="tipo">
         Tipo de usu&aacute;rio
        </label>
        <select class="form-select" id="tipo">
         <option value="funcionario">
          Funcion&aacute;rio
         </option>
         <option value="admin">
          Administrador
         </option>
         <option value="cliente">
          Cliente
         </option>
        </select>
       </div>
       <div class="mb-3 d-none" id="campoIdCliente">
        <label class="form-label" for="idcliente">
         ID do cliente j&aacute; cadastrado
        </label>
        <input class="form-control" id="idcliente" min="1" type="number"/>
        <div class="form-text">
         Use o ID mostrado na tela Clientes.
        </div>
       </div>
       <button class="btn btn-dark" type="submit">
        Cadastrar usu&aacute;rio
       </button>
      </form>
     </div>
    </div>
   </div>
  </main>
  <script src="js/config.js">
  </script>
  <script src="js/auth.js">
  </script>
  <script src="js/cadastro.js">
  </script>
 </body>
</html>
