<!DOCTYPE html>
<html lang="pt-BR">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Agendamentos | Est&uacute;dio Ink
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <nav class="navbar navbar-expand-lg navbar-dark" style="background:#211b1b">
   <div class="container">
    <a class="navbar-brand" href="dashboard.html">
     ✦ Est&uacute;dio Ink
    </a>
    <div class="d-flex align-items-center gap-3">
     <span class="text-white small" id="usuarioAtual">
     </span>
     <a class="btn btn-sm btn-outline-light" href="dashboard.html">
      Painel
     </a>
     <button class="btn btn-sm btn-light" id="botaoSair">
      Sair
     </button>
    </div>
   </div>
  </nav>
  <main class="container py-4">
   <h1 class="h2">
    Agendamentos
   </h1>
   <p class="small-muted">
    Organize sess&otilde;es e anexe o desenho aprovado.
   </p>
   <div class="card p-4 mb-4">
    <form id="formAgendamento">
     <div class="row g-3">
      <div class="col-md-6">
       <label class="form-label">
        Cliente
       </label>
       <select class="form-select" id="idcliente" name="idcliente" required="">
       </select>
      </div>
      <div class="col-md-6">
       <label class="form-label">
        Tatuador
       </label>
       <select class="form-select" id="idtatuador" name="idtatuador" required="">
       </select>
      </div>
      <div class="col-md-4">
       <label class="form-label">
        Data
       </label>
       <input class="form-control" name="dataagendamento" required="" type="date"/>
      </div>
      <div class="col-md-4">
       <label class="form-label">
        Hora
       </label>
       <input class="form-control" name="horaagendamento" required="" type="time"/>
      </div>
      <div class="col-md-4">
       <label class="form-label">
        Valor (R$)
       </label>
       <input class="form-control" min="0" name="valortatuagem" step="0.01" type="number"/>
      </div>
      <div class="col-md-6">
       <label class="form-label">
        Descri&ccedil;&atilde;o da tatuagem
       </label>
       <textarea class="form-control" name="descricaotatuagem" rows="2"></textarea>
      </div>
      <div class="col-md-6">
       <label class="form-label">
        Desenho aprovado (PNG/JPG/WEBP at&eacute; 5 MB)
       </label>
       <input accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp" class="form-control" name="desenho" type="file"/>
      </div>
      <div class="col-md-4 d-none" id="statusBox">
       <label class="form-label">
        Status (edi&ccedil;&atilde;o)
       </label>
       <select class="form-select" name="status">
        <option value="pendente">
         Pendente
        </option>
        <option value="confirmado">
         Confirmado
        </option>
        <option value="concluido">
         Conclu&iacute;do
        </option>
        <option value="cancelado">
         Cancelado
        </option>
       </select>
      </div>
     </div>
     <div class="mt-3 d-flex gap-2">
      <button class="btn btn-dark" type="submit">
       Salvar agendamento
      </button>
      <button class="btn btn-outline-secondary" id="botaoCancelar" type="button">
       Limpar
      </button>
     </div>
    </form>
   </div>
   <div class="card p-3">
    <div class="table-responsive">
     <table class="table">
      <thead>
       <tr>
        <th>
         ID
        </th>
        <th>
         Cliente
        </th>
        <th>
         Tatuador
        </th>
        <th>
         Data
        </th>
        <th>
         Hora
        </th>
        <th>
         Status
        </th>
        <th>
         Valor
        </th>
        <th>
         Desenho
        </th>
        <th>
         A&ccedil;&otilde;es
        </th>
       </tr>
      </thead>
      <tbody id="lista">
      </tbody>
     </table>
    </div>
   </div>
  </main>
  <script src="js/config.js">
  </script>
  <script src="js/auth.js">
  </script>
  <script src="js/agendamentos.js">
  </script>
 </body>
</html>
