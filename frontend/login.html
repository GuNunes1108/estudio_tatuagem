<!DOCTYPE html>
<html lang="pt-BR">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Login | Est&uacute;dio Ink
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <main class="container py-5">
   <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
     <a class="text-decoration-none small-muted" href="index.html">
      &larr; Voltar ao in&iacute;cio
     </a>
     <div class="card p-4 p-md-5 mt-3">
      <div class="text-center mb-4">
       <div class="tattoo-mark">
        ✦
       </div>
       <h1 class="h2">
        Bem-vindo de volta
       </h1>
       <p class="small-muted">
        Entre para acessar o painel do est&uacute;dio.
       </p>
      </div>
      <div aria-live="polite" id="aviso">
      </div>
      <form id="formLogin">
       <div class="mb-3">
        <label class="form-label" for="email">
         E-mail
        </label>
        <input autocomplete="username" class="form-control" id="email" required="" type="email"/>
       </div>
       <div class="mb-3">
        <label class="form-label" for="senha">
         Senha
        </label>
        <input autocomplete="current-password" class="form-control" id="senha" required="" type="password"/>
       </div>
       <button class="btn btn-dark w-100" type="submit">
        Entrar
       </button>
      </form>
      <p class="small-muted mt-3 mb-0">
       O acesso &eacute; criado por um administrador. N&atilde;o h&aacute; cadastro p&uacute;blico.
      </p>
     </div>
    </div>
   </div>
  </main>
  <script src="js/config.js">
  </script>
  <script src="js/login.js">
  </script>
 </body>
</html>
