<!DOCTYPE html>
<html lang="pt-BR">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Clientes | Est&uacute;dio Ink
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <nav class="navbar navbar-expand-lg navbar-dark" style="background:#211b1b">
   <div class="container">
    <a class="navbar-brand" href="dashboard.html">
     ✦ Est&uacute;dio Ink
    </a>
    <div class="d-flex align-items-center gap-3">
     <span class="text-white small" id="usuarioAtual">
     </span>
     <a class="btn btn-sm btn-outline-light" href="dashboard.html">
      Painel
     </a>
     <button class="btn btn-sm btn-light" id="botaoSair">
      Sair
     </button>
    </div>
   </div>
  </nav>
  <main class="container py-4">
   <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
     <h1 class="h2">
      Clientes
     </h1>
     <p class="small-muted">
      Cadastre e mantenha os dados de contato.
     </p>
    </div>
    <button class="btn btn-dark" id="botaoNovo">
     + Novo cliente
    </button>
   </div>
   <div class="card p-4 mb-4">
    <h2 class="h5" id="tituloForm">
     Novo cliente
    </h2>
    <form id="formCliente">
     <div class="row g-3">
      <div class="col-md-6">
       <label class="form-label">
        Nome
       </label>
       <input class="form-control" id="nome" maxlength="100" name="nome" required=""/>
      </div>
      <div class="col-md-6">
       <label class="form-label">
        CPF (11 n&uacute;meros)
       </label>
       <input class="form-control" id="cpf" maxlength="11" name="cpf" pattern="[0-9]{11}" required=""/>
      </div>
      <div class="col-md-4">
       <label class="form-label">
        Telefone
       </label>
       <input class="form-control" id="telefone" name="telefone"/>
      </div>
      <div class="col-md-4">
       <label class="form-label">
        Cidade
       </label>
       <input class="form-control" id="cidade" name="cidade"/>
      </div>
      <div class="col-md-4">
       <label class="form-label">
        UF
       </label>
       <input class="form-control" id="uf" maxlength="2" name="uf"/>
      </div>
     </div>
     <div class="mt-3">
      <button class="btn btn-dark" type="submit">
       Salvar
      </button>
     </div>
    </form>
   </div>
   <div class="card p-3">
    <div class="table-responsive">
     <table class="table table-hover">
      <thead>
       <tr>
        <th>
         ID
        </th>
        <th>
         Nome
        </th>
        <th>
         CPF
        </th>
        <th>
         Telefone
        </th>
        <th>
         Cidade
        </th>
        <th>
         UF
        </th>
        <th>
         A&ccedil;&otilde;es
        </th>
       </tr>
      </thead>
      <tbody id="listaClientes">
      </tbody>
     </table>
    </div>
   </div>
  </main>
  <script src="js/config.js">
  </script>
  <script src="js/auth.js">
  </script>
  <script src="js/clientes.js">
  </script>
 </body>
</html>
