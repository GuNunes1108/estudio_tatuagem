<!DOCTYPE html>
<html lang="pt-BR">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Tatuadores | Est&uacute;dio Ink
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <nav class="navbar navbar-expand-lg navbar-dark" style="background:#211b1b">
   <div class="container">
    <a class="navbar-brand" href="dashboard.html">
     ✦ Est&uacute;dio Ink
    </a>
    <div class="d-flex align-items-center gap-3">
     <span class="text-white small" id="usuarioAtual">
     </span>
     <a class="btn btn-sm btn-outline-light" href="dashboard.html">
      Painel
     </a>
     <button class="btn btn-sm btn-light" id="botaoSair">
      Sair
     </button>
    </div>
   </div>
  </nav>
  <main class="container py-4">
   <h1 class="h2">
    Tatuadores
   </h1>
   <p class="small-muted">
    Gerencie a equipe e os estilos dominados.
   </p>
   <div class="card p-4 mb-4">
    <form id="formTatuador">
     <div class="row g-3">
      <div class="col-md-6">
       <label class="form-label">
        Nome
       </label>
       <input class="form-control" maxlength="100" name="nometatuador" required=""/>
      </div>
      <div class="col-md-6">
       <label class="form-label">
        CPF (11 n&uacute;meros)
       </label>
       <input class="form-control" maxlength="11" name="cpf" pattern="[0-9]{11}" required=""/>
      </div>
      <div class="col-md-4">
       <label class="form-label">
        E-mail
       </label>
       <input class="form-control" name="email" type="email"/>
      </div>
      <div class="col-md-4">
       <label class="form-label">
        Telefone
       </label>
       <input class="form-control" name="telefone"/>
      </div>
      <div class="col-md-4">
       <label class="form-label">
        Data de contrata&ccedil;&atilde;o
       </label>
       <input class="form-control" name="datacontratacao" type="date"/>
      </div>
      <div class="col-md-6">
       <label class="form-label">
        Senioridade
       </label>
       <select class="form-select" id="idsenioridade" name="idsenioridade" required="">
       </select>
      </div>
      <div class="col-12">
       <label class="form-label d-block">
        Estilos
       </label>
       <div class="d-flex flex-wrap" id="opcoesEstilos">
       </div>
      </div>
     </div>
     <div class="mt-3 d-flex gap-2">
      <button class="btn btn-dark" type="submit">
       Salvar tatuador
      </button>
      <button class="btn btn-outline-secondary" id="botaoCancelar" type="button">
       Limpar
      </button>
     </div>
    </form>
   </div>
   <div class="card p-3">
    <div class="table-responsive">
     <table class="table">
      <thead>
       <tr>
        <th>
         ID
        </th>
        <th>
         Nome
        </th>
        <th>
         CPF
        </th>
        <th>
         Senioridade
        </th>
        <th>
         Estilos
        </th>
        <th>
         A&ccedil;&otilde;es
        </th>
       </tr>
      </thead>
      <tbody id="lista">
      </tbody>
     </table>
    </div>
   </div>
  </main>
  <script src="js/config.js">
  </script>
  <script src="js/auth.js">
  </script>
  <script src="js/tatuadores.js">
  </script>
 </body>
</html>
