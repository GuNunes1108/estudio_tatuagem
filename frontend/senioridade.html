<!DOCTYPE html>
<html lang="pt-BR">
 <head>

 </head>
 <body>
  <nav class="navbar navbar-expand-lg navbar-dark" style="background:#211b1b">
   <div class="container">
    <a class="navbar-brand" href="dashboard.html">
     ✦ Est&uacute;dio Ink
    </a>
    <div class="d-flex align-items-center gap-3">
     <span class="text-white small" id="usuarioAtual">

      Painel
     </a>
     <button class="btn btn-sm btn-light" id="botaoSair">
      Sair

    </div>
   </div>
  </nav>
  <main class="container py-4">
   <h1 class="h2">

   <div class="card p-4 mb-4">

      <label class="form-label">
       Nome

      <input class="form-control" maxlength="50" name="nome" placeholder="Ex.: J&uacute;nior" required=""/>

   <div class="card p-3">

    </div>
   </div>
  </main>
  <script src="js/config.js">
